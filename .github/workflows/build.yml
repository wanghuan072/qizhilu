name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Fetch site settings
        run: bun run fetch-site-settings
        env:
          NEXT_PUBLIC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_PROJECT_ID || 'default-project-id' }}
          NEXT_PUBLIC_WEB_API_URL: ${{ secrets.NEXT_PUBLIC_WEB_API_URL || 'https://api.example.com' }}
          NEXT_PUBLIC_DEFAULT_LOCALE: ${{ secrets.NEXT_PUBLIC_DEFAULT_LOCALE || 'en' }}

      - name: Build project
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_PROJECT_ID || 'default-project-id' }}
          NEXT_PUBLIC_WEB_API_URL: ${{ secrets.NEXT_PUBLIC_WEB_API_URL || 'https://api.example.com' }}
          NEXT_PUBLIC_DEFAULT_LOCALE: ${{ secrets.NEXT_PUBLIC_DEFAULT_LOCALE || 'en' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: out/
          retention-days: 7

      - name: Check build output
        run: |
          if [ -d "out" ]; then
            echo "✅ Build successful! Output directory exists."
            ls -la out/ | head -20
          else
            echo "❌ Build failed! Output directory not found."
            exit 1
          fi
